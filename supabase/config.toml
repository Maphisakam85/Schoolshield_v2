project_id = "schoolshield"

[auth.email.template.invite]
subject = "SchoolShield | Your school account invitation"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "SchoolShield | Secure password setup or reset"
content_path = "./supabase/templates/recovery.html"

[functions.approve-account]
# This function verifies the Auth token and school approval permissions itself.
verify_jwt = false

[functions.school-branding]
verify_jwt = true
static_files = ["./functions/school-branding/vendor/*.wasm"]

[functions.push-dispatch]
# Independent server-to-server secret checked inside this scheduled function.
verify_jwt = false
[functions.support-email-dispatch]
# Scheduled dispatcher validates SUPPORT_DISPATCH_SECRET before using service credentials.
verify_jwt = false
