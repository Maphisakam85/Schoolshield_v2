project_id = "schoolshield"

[functions.approve-account]
# This function verifies the Auth token and school approval permissions itself.
verify_jwt = false

[functions.school-branding]
# Auth identity and platform membership are verified inside the handler.
verify_jwt = false
static_files = ["./functions/school-branding/vendor/*.wasm"]

[functions.push-dispatch]
# Independent server-to-server secret checked inside this scheduled function.
verify_jwt = false

[functions.manage-users]
verify_jwt = false

[functions.provision-school]
verify_jwt = false

[functions.report-problem]
# getUser and the school-profile RPC enforce authorization inside the handler.
verify_jwt = false

[auth.email.template.invite]
subject = "Your SchoolShield account is approved — complete setup"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Your secure SchoolShield account access link"
content_path = "./supabase/templates/recovery.html"
