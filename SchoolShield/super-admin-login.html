<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SchoolShield | Sign in</title>
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="super-admin.css">
</head>
<body class="auth-page" data-platform-page="login">
  <div class="auth-layout">
    <aside class="auth-visual" aria-label="School community">
      <img src="assets/login-campus-branded.png" alt="School staff walking together on campus">
      <div class="auth-story"><span>ONE SCHOOL. ONE CONNECTED COMMUNITY.</span><h2>A safer school starts with connection.</h2><p>Support your schools and keep every community connected.</p></div>
    </aside>
    <main class="auth">
      <div class="auth-brand"><img src="assets/schoolshield-logo.png" alt="SchoolShield logo"><div><strong>SchoolShield</strong><small>School safety &amp; management</small></div></div>
      <h1>Welcome back</h1><p>Sign in to manage your schools.</p>
      <form id="platformLogin" class="platform-signin-form">
        <label>School access code<input class="input" name="accessCode" required autocomplete="off" placeholder="Enter your access code"></label>
        <label>Email address<input class="input" name="email" type="email" required autocomplete="username" placeholder="Your email address"></label>
        <label>Password<input class="input" name="password" type="password" required autocomplete="current-password" placeholder="Password"></label>
        <button class="btn primary" type="submit">Sign in</button>
      </form>
      <p id="platformStatus" role="status" aria-live="polite"></p>
      <a class="platform-signin-back" href="login.html">Back to school sign in</a>
    </main>
  </div>
  <script src="password-toggle.js"></script><script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="super-admin.js"></script>
</body>
</html>
