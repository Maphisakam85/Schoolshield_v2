<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <title>SchoolShield — SGB–Security Chat</title>
  <link rel="stylesheet" href="styles.css">
<script defer src="analytics.js"></script>
</head>
<body data-page="sgb-security-chat">
  <div id="app"><div class="page-loading" role="status"><span class="loading-spinner" aria-hidden="true"></span><p>Loading your school workspace...</p></div></div>
<template id="directChatTemplate">
<section class="direct-chat" id="directChatWorkspace" data-view="list" aria-label="Private school conversations">
  <aside class="direct-chat-list" aria-label="Conversations">
    <header class="direct-chat-list-head"><div><h1 id="directChatTitle">Chat</h1></div><button type="button" class="btn small" id="directChatRefresh">Refresh</button></header>
    <p id="directChatDescription" hidden></p>
    <label class="chat-sr-only" for="directChatSearch">Search conversations</label><input class="input" id="directChatSearch" type="search" placeholder="Search by name or message" autocomplete="off">
    <span id="directChatCount" class="chat-sr-only"></span>
    <nav id="directChatContacts" aria-label="People you can message"><p class="direct-chat-empty">Loading conversations...</p></nav>
  </aside>
  <section class="direct-chat-thread" aria-label="Selected conversation">
    <header class="direct-chat-thread-head"><button type="button" class="btn small direct-chat-back" id="directChatBack" aria-expanded="true" title="Show or hide conversations">Chats</button><span class="avatar" id="directChatAvatar" aria-hidden="true">SS</span><div><h2 id="directChatName">Your conversations</h2><p id="directChatPeerInfo">Private messages within your school</p></div></header>
    <p id="directChatStatus" role="status" aria-live="polite"></p>
    <div class="direct-chat-history"><button type="button" class="btn small" id="directChatOlder" hidden>Load older messages</button></div>
    <div id="directChatMessages" role="log" aria-label="Conversation messages" aria-live="polite"></div>
    <p id="directChatEmpty" class="direct-chat-empty" hidden>No messages yet. Say hello below.</p>
    <form id="directChatForm"><label class="direct-chat-input-label" for="directChatInput">Message</label><textarea class="input" id="directChatInput" maxlength="4000" rows="1" placeholder="Write a secure message..." required disabled></textarea><button class="btn primary" id="directChatSend" type="submit" disabled>Send</button></form>
  </section>
</section>
</template>
<link rel="stylesheet" href="sgb-security-chat.css">
<script src="sgb-security-chat.js"></script>
  <script src="ui-feedback.js"></script>
    <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-client.js"></script>
  <script src="chat-mobile.js"></script>
  <script src="chat-navigation.js"></script>
  <script src="school-theme.js"></script><script src="school-branding.js"></script>
    <script src="app.js"></script>
</body>
</html>
