<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>SchoolShield — Register</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #062a34, #0a735a);
            display: grid;
            place-items: center
        }

        .auth {
            width: min(520px, calc(100% - 30px));
            background: #fff;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 25px 80px #0004
        }

        .auth-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px
        }

        .auth-brand img {
            width: 46px
        }

        .auth h1 {
            font-size: 23px;
            margin: 0 0 6px
        }

        .auth p {
            font-size: 11px;
            color: #71838a
        }

        .auth label {
            display: block;
            font-size: 9px;
            font-weight: 700;
            margin: 13px 0 6px
        }

        .form-grid {
            margin-top: 12px
        }
    </style>
</head>

<body>
    <main class="auth">
        <div class="auth-brand"><img src="assets/schoolshield-logo.png"><b>SchoolShield</b></div>
        <h1>Create an account</h1>
        <p>Account creation is followed by verification and role assignment by an authorised administrator.</p>
        <div class="form-grid"><label>Full name<input class="input" placeholder="Full name"></label><label>Email<input
                    class="input" placeholder="name@school.co.za"></label><label>Password<input class="input"
                    type="password" placeholder="Create password"></label><label>Confirm password<input class="input"
                    type="password" placeholder="Confirm password"></label><label>Requested role<select class="select">
                    <option>Parent / Guardian</option>
                    <option>Teacher</option>
                    <option>School Clerk</option>
                    <option>Security Officer</option>
                </select></label></div><button class="btn primary" style="width:100%;margin-top:18px">Create
            account</button>
        <p style="text-align:center;margin-top:18px"><a href="login.html" style="color:#087550;font-weight:700">Back to
                sign in</a></p>
    </main>
</body>

</html>
