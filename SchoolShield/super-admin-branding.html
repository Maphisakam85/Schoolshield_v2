<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SchoolShield | School branding</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="super-admin.css"></head>
<body data-platform-page="branding"><header class="platform-header"><img class="platform-logo" src="assets/schoolshield-logo.png" alt="SchoolShield"><strong>SchoolShield Super Admin</strong><small id="platformIdentity"></small><a href="super-admin.html">School directory</a><button class="btn" id="platformLogout" hidden>Sign out</button></header><main class="platform-main"><p id="platformStatus" role="status">Verifying platform access...</p><a id="platformSignIn" href="super-admin-login.html">Platform sign in</a><div id="platformContent" hidden><section class="panel platform-school-heading"><h1 id="selectedSchoolName"></h1><p>School code: <strong id="selectedSchoolCode"></strong></p><small id="selectedSchoolId"></small><p><a class="btn" data-school-management>School management</a></p></section><section class="panel"><div class="panel-head"><h2>School branding</h2><button class="btn" id="platformRefresh">Refresh logo</button></div><h3>Current logo</h3><img id="currentLogo" class="school-logo-preview" src="assets/schoolshield-logo.png" alt="Current school logo"><p id="currentLogoStatus">SchoolShield fallback</p><form id="brandingForm"><label>Upload or replace logo<input class="input" id="logoFile" type="file" accept="image/png,image/jpeg,image/webp" required></label><p>PNG, JPEG or WebP, up to 2 MB and 2048 × 2048 pixels. Logos retain their aspect ratio.</p><figure id="logoPreview" hidden><img class="school-logo-preview" id="previewLogo" alt="Replacement logo preview"><figcaption>Preview only; the current logo stays active until the upload and save succeed.</figcaption></figure><label>Reason for change<textarea class="textarea" id="logoReason" minlength="5" maxlength="500" required></textarea></label><div class="action-row"><button class="btn primary" type="submit">Upload and save logo</button><button class="btn" type="button" id="removeLogo">Reset / remove school logo</button></div></form></section></div></main><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="super-admin-branding.js"></script><script src="super-admin.js"></script></body></html>
